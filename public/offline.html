<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>Hors ligne — GTEC PRO</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        --gtec-green: #15803d;
        --gtec-green-dark: #14532d;
        --gtec-amber: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(1100px 500px at 50% -10%, rgba(21,128,61,.28), transparent 60%),
          linear-gradient(160deg, #052e16 0%, #14532d 55%, #166534 100%);
        color: #f0fdf4;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 20px;
        padding: 36px 28px 30px;
        background: rgba(255,255,255,.06);
        backdrop-filter: blur(8px);
      }
      .bolt {
        display: inline-flex; align-items: center; justify-content: center;
        width: 68px; height: 68px; border-radius: 50%;
        background: linear-gradient(140deg, var(--gtec-green) 0%, var(--gtec-green-dark) 100%);
        border: 1px solid rgba(255,255,255,.18);
        margin-bottom: 18px;
      }
      .bolt svg { width: 32px; height: 32px; fill: #fef3c7; }
      h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; letter-spacing: .2px; }
      p { margin: 0 0 22px; font-size: 14px; line-height: 1.6; color: rgba(240,253,244,.78); }
      .offline-badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
        color: #fde68a;
        border: 1px solid rgba(245,158,11,.45);
        background: rgba(245,158,11,.12);
        border-radius: 999px;
        padding: 5px 12px;
        margin-bottom: 16px;
      }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: #f0fdf4;
        color: var(--gtec-green-dark);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform .15s ease, opacity .15s ease;
      }
      button:hover { transform: translateY(-1px); }
      button:active { transform: translateY(0); opacity: .9; }
      .hint { margin-top: 16px; font-size: 12px; color: rgba(240,253,244,.55); }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="offline-badge">● Hors ligne</span>
      <div class="bolt" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H11l-1 8.5L18.5 10H12l1-8z"/></svg>
      </div>
      <h1>Connexion indisponible</h1>
      <p>
        Vous êtes hors ligne. Vérifiez votre réseau ou vos données mobiles,
        puis réessayez — vos données GTEC se rechargeront automatiquement.
      </p>
      <button onclick="location.reload()">Réessayer</button>
      <p class="hint">GTEC PRO — Green Tech Energy Cameroon</p>
    </main>
    <script>
      // Retour automatique dès que le réseau revient.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
